<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Versículo del día</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Quicksand:wght@400;500;700&family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="gatito3.css">
</head>
<body>

  <div class="contenedor">
    <div class="emoji-gato">🐱</div>

    <div class="agenda-hoja">
      <div class="espiral" aria-hidden="true">
        <span class="anillo"></span>
        <span class="anillo"></span>
        <span class="anillo"></span>
        <span class="anillo"></span>
        <span class="anillo"></span>
        <span class="anillo"></span>
        <span class="anillo"></span>
      </div>

      <div class="estrellas" aria-hidden="true">
        <span class="estrella estrella-1">⭐</span>
        <span class="estrella estrella-2">✨</span>
        <span class="estrella estrella-3">⭐</span>
        <span class="estrella estrella-4">✨</span>
        <span class="estrella estrella-5">⭐</span>
      </div>

      <p class="fecha-hoy" id="fecha-hoy">Cargando fecha…</p>

      <!-- REEMPLAZAR: dedicatoria fija (texto permanente, no rota) -->
      <p class="dedicatoria">Recuerda que Jesús te ama Marian</p>

      <h1 class="titulo-versiculo">
        <span class="titulo-bold">Versículo</span><span class="titulo-script">del día</span>
      </h1>

      <div class="cuerpo-versiculo">
        <p class="texto-versiculo" id="texto-versiculo">Cargando versículo…</p>
        <p class="referencia-versiculo" id="referencia-versiculo"></p>

        <div class="sticker-mensaje">
          <span id="mensaje-versiculo"></span>
        </div>
      </div>
    </div>

    <a class="volver" href="index.html">← volver</a>
  </div>

  <!-- PENDIENTE: reemplazar assets/versiculos.json con los 365 registros finales (por ahora tiene 10 de prueba para verificar la rotación) -->
  <script>
    // ---------- Datos de fecha en español (sin depender del locale del navegador) ----------
    const DIAS_SEMANA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    // ---------- Paletas de color (rotan según el día del año, independiente del versículo) ----------
    const PALETAS = [
      { // 1. Cotton Cloud + Glossy Cherry
        nombre: 'Cotton Cloud & Glossy Cherry',
        fondo: '#94DEFF',
        acento: '#FF277F',
        acentoSecundario: '#94DEFF',
        textoSticker: '#ffffff'
      },
      { // 2. Old Rose + Seashell + Sky Blue
        nombre: 'Old Rose, Seashell & Sky Blue',
        fondo: '#FAF0EA',
        acento: '#E19AA6',
        acentoSecundario: '#82B0CE',
        textoSticker: '#3a2222'
      },
      { // 3. Moon Tint + Sunny Herb + Blue Harbor + Ice Blue
        nombre: 'Moon Tint, Sunny Herb, Blue Harbor & Ice Blue',
        fondo: '#F3F6FF',
        acento: '#3770BF',
        acentoSecundario: '#8DC2FF',
        textoSticker: '#ffffff'
      },
      { // 4. Vista Blue + Mindaro
        nombre: 'Vista Blue & Mindaro',
        fondo: '#FEFFAF',
        acento: '#78A2D2',
        acentoSecundario: '#78A2D2',
        textoSticker: '#2b2a1e'
      }
    ];

    // Día del año (1-366). El módulo posterior evita que el día 366
    // de un año bisiesto quede fuera de rango: simplemente reutiliza
    // el índice que le corresponda dentro del array disponible.
    function obtenerDiaDelAnio(fecha) {
      const inicioDeAnio = new Date(fecha.getFullYear(), 0, 0);
      const diferenciaMs = fecha - inicioDeAnio;
      const unDiaMs = 1000 * 60 * 60 * 24;
      return Math.floor(diferenciaMs / unDiaMs);
    }

    function mostrarFecha(fecha) {
      const diaSemana = DIAS_SEMANA[fecha.getDay()];
      const dia = fecha.getDate();
      const mes = MESES[fecha.getMonth()];
      document.getElementById('fecha-hoy').textContent = `${diaSemana}, ${dia} de ${mes}`;
    }

    // Cálculo de paleta: totalmente independiente del índice de versículo
    // (no comparte fórmula ni depende de la cantidad de versículos cargados).
    function aplicarPaleta(fecha) {
      const diaDelAnio = obtenerDiaDelAnio(fecha);
      const indice = diaDelAnio % PALETAS.length;
      const paleta = PALETAS[indice];

      const raiz = document.documentElement;
      raiz.style.setProperty('--agenda-fondo', paleta.fondo);
      raiz.style.setProperty('--agenda-acento', paleta.acento);
      raiz.style.setProperty('--agenda-acento-secundario', paleta.acentoSecundario);
      raiz.style.setProperty('--agenda-texto-sticker', paleta.textoSticker);

      return paleta;
    }

    async function cargarVersiculo(fecha) {
      const elTexto = document.getElementById('texto-versiculo');
      const elReferencia = document.getElementById('referencia-versiculo');
      const elMensaje = document.getElementById('mensaje-versiculo');

      try {
        const respuesta = await fetch('assets/versiculos.json');
        if (!respuesta.ok) {
          throw new Error(`No se pudo cargar versiculos.json (status ${respuesta.status})`);
        }
        const versiculos = await respuesta.json();
        if (!Array.isArray(versiculos) || versiculos.length === 0) {
          throw new Error('El archivo de versículos está vacío');
        }

        // Día del año + offset anual, módulo cantidad de versículos disponibles.
        // Con menos de 365 entradas (modo de prueba) el módulo igual evita
        // que el índice quede fuera de rango.
        const diaDelAnio = obtenerDiaDelAnio(fecha);
        const offset = fecha.getFullYear() % 365;
        const indice = (diaDelAnio + offset) % versiculos.length;
        const versiculo = versiculos[indice];

        elTexto.textContent = versiculo.texto;
        elReferencia.textContent = versiculo.referencia;
        elMensaje.textContent = versiculo.mensaje;

        return { indice, versiculo };
      } catch (error) {
        console.error('Error cargando el versículo del día:', error);
        elTexto.textContent = 'No pudimos cargar el versículo de hoy. Volvé a intentar más tarde.';
        elReferencia.textContent = '';
        elMensaje.textContent = '';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const hoy = new Date();
      mostrarFecha(hoy);
      aplicarPaleta(hoy);
      cargarVersiculo(hoy);
    });
  </script>

</body>
</html>
